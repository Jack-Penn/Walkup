<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome home — Threshold</title><link rel="icon" href="{{ url_for('static',filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-mark"><span></span></span>threshold<span class="brand-period">.</span></a><div class="eyebrow">YOUR LOCAL CONTROL ROOM</div><h1>Welcome back.</h1><p>A little sound. A warmer hello.<br>Sign in to make yourself at home.</p>{% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label for="password">PORTAL PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" autofocus required placeholder="Your portal password"><button class="button dark" type="submit">Open your control room <span aria-hidden="true">→</span></button></form><div class="login-footer">Local control. All yours.</div></main></body></html>
